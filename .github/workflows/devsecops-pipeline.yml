name: 'DevSecOps Pipeline'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: dotnet-app
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: my-docker-repo

jobs:
  secret-scan:
    name: 'Secret Scan (Gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sca-scan:
    name: 'SCA Scan (Trivy)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  sast-scan:
    name: 'SAST Scan (Semgrep)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/csharp
        continue-on-error: true

  build:
    name: 'Build and Sign Image'
    needs: [secret-scan, sca-scan, sast-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.image_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        id: build-push
        run: |
          FULL_IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $FULL_IMAGE_NAME .
          docker push $FULL_IMAGE_NAME
          
          # Capture the digest using docker inspect
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $FULL_IMAGE_NAME)
          echo "Captured Digest: $IMAGE_DIGEST"
          
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::Failed to capture image digest. Check if the image was pushed successfully."
            exit 1
          fi
          
          echo "image_digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
          echo "### Image Built and Pushed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** $FULL_IMAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** $IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY

      # Container Image Scan
      - name: Run Trivy vulnerability scanner (Container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.build-push.outputs.image_digest }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Initialize Cosign TUF
        run: cosign initialize

      # Sign using the immutable digest
      - name: Sign Docker Image
        run: |
          cosign sign --yes ${{ steps.build-push.outputs.image_digest }}

  deploy:
    name: 'Deploy to GKE'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: gke-devsecops-cluster
          location: ${{ env.GCP_REGION }}

      - name: Debug Received Digest
        run: |
          echo "### Deployment Debug Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Received Digest:** ${{ needs.build.outputs.image_digest }}" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ needs.build.outputs.image_digest }}" ]; then
            echo "- :x: **Error:** Image digest is empty!" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :white_check_mark: **Status:** Digest received successfully." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deploy to GKE
        run: |
          # Validate digest
          if [ -z "${{ needs.build.outputs.image_digest }}" ]; then
            echo "::error::Image digest from build job is empty. Cannot proceed with deployment."
            exit 1
          fi
          # Apply manifests to ensure deployment and service exist
          kubectl apply -f k8s/
          # Update the deployment with the new image digest from the build job
          kubectl set image deployment/dotnet-app dotnet-app=${{ needs.build.outputs.image_digest }}
          kubectl rollout status deployment/dotnet-app
