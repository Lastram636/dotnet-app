name: 'DevSecOps Pipeline'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: dotnet-app
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: my-docker-repo

jobs:
  secret-scan:
    name: 'Secret Scan (Gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sca-scan:
    name: 'SCA Scan (Trivy)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  sast-scan:
    name: 'SAST Scan (Semgrep)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/csharp
        continue-on-error: true

  build:
    name: 'Build and Sign Image'
    needs: [secret-scan, sca-scan, sast-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.image_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        id: build-push
        run: |
          # Define image name without tag for digest reference
          BASE_IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          TAGGED_IMAGE_NAME="$BASE_IMAGE_NAME:${{ github.sha }}"
          
          docker build -t $TAGGED_IMAGE_NAME .
          docker push $TAGGED_IMAGE_NAME
          
          # Capture the digest using gcloud
          DIGEST=$(gcloud container images describe $TAGGED_IMAGE_NAME --format='get(image_summary.digest)')
          
          if [ -z "$DIGEST" ]; then
            echo "::error::Failed to capture image digest from gcloud."
            exit 1
          fi
          
          # Construct the full immutable reference
          FULL_IMAGE_REF="$BASE_IMAGE_NAME@$DIGEST"
          echo "Full Reference: $FULL_IMAGE_REF"
          
          echo "image_digest=$FULL_IMAGE_REF" >> $GITHUB_OUTPUT
          
          echo "### Build Success :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tagged:** $TAGGED_IMAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Immutable Ref:** $FULL_IMAGE_REF" >> $GITHUB_STEP_SUMMARY
          
          # Write digest to file for artifact upload
          echo "$FULL_IMAGE_REF" > image_digest.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: image_digest.txt

      # Container Image Scan
      - name: Run Trivy vulnerability scanner (Container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.build-push.outputs.image_digest }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Initialize Cosign TUF
        run: cosign initialize

      # Sign using the immutable digest
      - name: Sign Docker Image
        run: |
          cosign sign --yes ${{ steps.build-push.outputs.image_digest }}

  deploy:
    name: 'Deploy to GKE'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: gke-devsecops-cluster
          location: ${{ env.GCP_REGION }}

      - name: Download Digest Artifact
        uses: actions/download-artifact@v4
        with:
          name: digest

      - name: Read Digest
        id: read-digest
        run: |
          IMAGE_DIGEST=$(cat image_digest.txt)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV
          
          echo "### Deployment Debug Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Read Artifact Digest:** $IMAGE_DIGEST" >> $GITHUB_STEP_SUMMARY
          
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "- :x: **Error:** Image digest artifact is empty!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "- :white_check_mark: **Status:** Digest read successfully." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Update Deployment Manifest and Push to Git
        run: |
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update the image in the deployment.yaml file
          # We use a pattern match to find the image: line inside the dotnet-app container definition
          # (Simplistic sed approach assuming standard formatting)
          sed -i "s|image: .*|image: ${{ env.IMAGE_DIGEST }}|g" k8s/deployment.yaml
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add k8s/deployment.yaml
            git commit -m "Update deployment image to ${{ env.IMAGE_DIGEST }} [skip ci]"
            # Explicitly push with token to bypass permission issues
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
            echo "Successfully updated deployment manifest in Git."
          fi

      - name: Deploy to GKE
        run: |
          # Apply manifests (now containing the correct authenticated image digest)
          kubectl apply -f k8s/
          # Monitor rollout
          kubectl rollout status deployment/dotnet-app
